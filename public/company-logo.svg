<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A5D6B" />
      <stop offset="100%" stop-color="#2F223A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79B6B8" />
      <stop offset="100%" stop-color="#4E8C8E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="12" y="12" width="176" height="176" rx="38" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Industrial Gear Geometry -->
  <g transform="translate(100, 85)">
    <!-- Outer Gear teeth -->
    <path d="
      M -12 -58 L 12 -58 L 10 -46 L -10 -46 Z
      M 46 -10 L 58 -12 L 58 12 L 46 10 Z
      M 10 46 L 12 58 L -12 58 L -10 46 Z
      M -46 10 L -58 12 L -58 -12 L -46 -10 Z
      M 26 -44 L 42 -38 L 36 -28 L 22 -36 Z
      M 36 28 L 42 38 L 26 44 L 22 36 Z
      M -22 36 L -26 44 L -42 38 L -36 28 Z
      M -36 -28 L -42 -38 L -26 -44 L -22 -36 Z
    " fill="url(#accentGrad)" />

    <!-- Gear Ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#accentGrad)" stroke-width="7" />
    
    <!-- Precision Inner Tool / Terminal Crimp Anvil shape -->
    <path d="M -24 -24 L 24 -24 L 18 16 L 0 28 L -18 16 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M -14 -16 L 14 -16 L 10 10 L 0 18 L -10 10 Z" fill="url(#bgGrad)" />

    <!-- Center Precision Dot -->
    <circle cx="0" cy="-2" r="6" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <text x="100" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="3">MECAL</text>
  <text x="100" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#79B6B8" letter-spacing="2">IPARI RAKTÁR</text>
</svg>
